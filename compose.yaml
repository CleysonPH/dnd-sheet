services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dnd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dnd}
      POSTGRES_DB: ${POSTGRES_DB:-dnd_sheet}
    ports:
      - "5432:5432"
    volumes:
      # A partir do Postgres 18 o volume é montado em /var/lib/postgresql
      # (os dados ficam em /var/lib/postgresql/18/docker).
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Imagem de produção, para testar localmente: docker compose --profile prod up
  # Em desenvolvimento o app roda fora do Docker (npm run dev).
  app:
    profiles: ["prod"]
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dnd}:${POSTGRES_PASSWORD:-dnd}@db:5432/${POSTGRES_DB:-dnd_sheet}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
