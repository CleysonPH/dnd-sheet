services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dnd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dnd}
      POSTGRES_DB: ${POSTGRES_DB:-dnd_sheet}
    ports:
      - "5432:5432"
    volumes:
      # A partir do Postgres 18 o volume é montado em /var/lib/postgresql
      # (os dados ficam em /var/lib/postgresql/18/docker).
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # SMTP de desenvolvimento e dos testes de integração (design P8). Só sobe com
  # o profile "dev": docker compose --profile dev up -d
  mailpit:
    profiles: ["dev"]
    image: axllent/mailpit:v1.31.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # interface web e API

volumes:
  db-data:
