services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dnd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dnd}
      POSTGRES_DB: ${POSTGRES_DB:-dnd_sheet}
    ports:
      - "5432:5432"
    volumes:
      # A partir do Postgres 18 o volume é montado em /var/lib/postgresql
      # (os dados ficam em /var/lib/postgresql/18/docker).
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # SMTP de desenvolvimento e dos testes de integração (design P8). Só sobe com
  # o profile "dev": docker compose --profile dev up -d
  mailpit:
    profiles: ["dev"]
    image: axllent/mailpit:v1.31.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # interface web e API

  # Migrações e seed do primeiro admin, rodados antes do app no profile "prod".
  # Usa o estágio builder do Dockerfile, que tem as dependências completas.
  migrate:
    profiles: ["prod"]
    build:
      context: .
      target: builder
    # O seed só roda se SEED_ADMIN_EMAIL estiver definida, para que as variáveis
    # do seed possam ser removidas depois da instalação.
    command: >-
      sh -c 'npm run db:migrate &&
      if [ -n "$$SEED_ADMIN_EMAIL" ]; then npm run db:seed; fi'
    environment:
      DATABASE_URL: &database-url postgresql://${POSTGRES_USER:-dnd}:${POSTGRES_PASSWORD:-dnd}@db:5432/${POSTGRES_DB:-dnd_sheet}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?defina BETTER_AUTH_SECRET no .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy

  # Imagem de produção, para testar localmente: docker compose --profile prod up
  # Em desenvolvimento o app roda fora do Docker (npm run dev).
  app:
    profiles: ["prod"]
    build: .
    environment:
      DATABASE_URL: *database-url
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?defina BETTER_AUTH_SECRET no .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      # Envio do link de redefinição de senha (design P9). O migrate não envia
      # e-mail e não precisa destas variáveis.
      SMTP_HOST: ${SMTP_HOST:?defina SMTP_HOST no .env}
      SMTP_PORT: ${SMTP_PORT:?defina SMTP_PORT no .env}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:?defina MAIL_FROM no .env}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
